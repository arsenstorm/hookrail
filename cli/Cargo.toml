[package]
name = "hookrail"
version = "0.1.0"
edition = "2021"
description = "Hookrail CLI — receive, inspect, and replay webhooks from your terminal."

[[bin]]
name = "hookrail"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
gethostname = "1"
# vendored: builds libdbus from source instead of requiring libdbus-1-dev on
# the build machine, so a Linux `cargo install` works without apt first.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
    "vendored",
] }
open = "5"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
url = "2"
