name: hookrail
icon: null
processes:
  CSS:
    command: bin/rails tailwindcss:watch
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
  Jobs:
    command: bin/jobs
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed:
    - Gemfile.lock
    env: {}
  Web:
    command: bin/rails server
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed:
    - Gemfile.lock
    env:
      PORT: '3000'
  Postgres:
    command: infra/postgres/launch.sh
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
  Redis:
    command: infra/redis/launch.sh
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
