version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  groups:
    gems:
      patterns: ["*"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  groups:
    github-actions:
      patterns: ["*"]
- package-ecosystem: cargo
  directory: "/cli"
  schedule:
    interval: weekly
  groups:
    crates:
      patterns: ["*"]
