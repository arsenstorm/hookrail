name: CLI e2e

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on PRs, but never cancel a main run mid-deploy.
concurrency:
  group: cli-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cli-e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect contract changes
        id: contract
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E \
            '^cli/|^app/channels/|^app/controllers/api/v1/cli/|^app/services/delivery/client\.rb$|^app/jobs/deliver_event_job\.rb$|^app/models/cli_|^config/routes\.rb$|^bin/e2e-cli$|^\.github/workflows/cli-e2e\.yml$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install packages
        if: steps.contract.outputs.changed == 'true'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Set up Ruby
        if: steps.contract.outputs.changed == 'true'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Cache cargo
        if: steps.contract.outputs.changed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: cargo-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Run CLI e2e transport check
        if: steps.contract.outputs.changed == 'true'
        env:
          E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hookrail_e2e_cli
        run: bin/e2e-cli
